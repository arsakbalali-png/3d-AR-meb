<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#11111a"><meta name="description" content="Telefon kameranda cringe emojisini 3B AR olarak keşfet."><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<title>Cringe Emoji AR</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#11111a;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}#cam{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;display:none;transform:scaleX(-1);z-index:0}#stage{position:fixed;inset:0;width:100%;height:100%;pointer-events:auto;touch-action:none;z-index:1}.shade{position:fixed;inset:0;background:linear-gradient(180deg,rgba(11,10,24,.6),transparent 28%,transparent 65%,rgba(11,10,24,.62));pointer-events:none;z-index:2}.top{position:fixed;z-index:3;top:env(safe-area-inset-top,12px);left:0;right:0;text-align:center;padding:16px}.badge{display:inline-block;padding:7px 13px;border:1px solid #ffffff50;border-radius:99px;background:#17132bbb;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#d8b5ff}.title{margin:8px 0 0;font-size:clamp(22px,6vw,32px);font-weight:850;text-shadow:0 2px 16px #000}.bottom{position:fixed;z-index:3;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);left:0;right:0;padding:0 20px;text-align:center}.hint{font-size:13px;color:#f4eaff;margin:0 auto 14px;text-shadow:0 1px 6px #000}.actions{display:flex;justify-content:center;gap:10px}.btn{border:0;border-radius:16px;padding:14px 20px;font-size:15px;font-weight:750;color:#191020;background:#e6c8ff;box-shadow:0 6px 26px #0006}.btn.secondary{background:#ffffff22;color:#fff;border:1px solid #ffffff55}.toast{position:fixed;z-index:4;top:45%;left:10%;right:10%;text-align:center;padding:18px;border-radius:18px;background:#181323dd;display:none;font-size:14px}@media(max-width:600px){.top{padding:calc(env(safe-area-inset-top,8px) + 8px) 12px}.title{font-size:clamp(22px,6vw,28px)}.bottom{bottom:calc(env(safe-area-inset-bottom,0px) + 14px);padding:0 12px}.hint{font-size:12px;margin-bottom:10px}.btn{padding:12px 18px}}.credit{position:fixed;right:12px;top:12px;font-size:10px;color:#ffffff7a}
</style>
</head><body>
<video id="cam" autoplay playsinline muted></video><canvas id="stage"></canvas><div class="shade"></div>
<div class="top"><span class="badge">Kameralı mini AR</span><h1 class="title">CRINGE EMOJİSİ</h1></div>
<div class="bottom"><p class="hint" id="hint">Kamerayı aç; model ekranın ortasında belirir.<br>Parmağınla sürükleyip çevir, yakınlaştırmak için iki parmak kullan.</p><div class="actions"><button class="btn" id="start">Kamerayı aç</button><button class="btn secondary" id="flip" style="display:none">Kamerayı çevir</button></div></div>
<div class="toast" id="toast"></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const video=document.querySelector('#cam'), canvas=document.querySelector('#stage'), start=document.querySelector('#start'), flip=document.querySelector('#flip'), toast=document.querySelector('#toast');
const renderer=new THREE.WebGLRenderer({canvas,alpha:true,antialias:true});renderer.setClearColor(0,0);renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene(), camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.1,100);camera.position.set(0,0,8);
scene.add(new THREE.HemisphereLight(0xfff5d7,0x704c39,2));const key=new THREE.DirectionalLight(0xffffff,2.5);key.position.set(-3,5,6);scene.add(key);const pink=new THREE.PointLight(0xff6d9d,15,12);pink.position.set(2,1,3);scene.add(pink);
const root=new THREE.Group();scene.add(root);
const mat=(c,rough=.48,metal=0)=>new THREE.MeshStandardMaterial({color:c,roughness:rough,metalness:metal});
const yellow=mat('#ffc928',.32), gold=mat('#ffad16',.38), white=mat('#fffdf7'), ink=mat('#35242c'), blush=mat('#ff7185'), blue=mat('#59d8ff',.25), tooth=mat('#fff8e8');
function ball(parent,m,pos,scale){let o=new THREE.Mesh(new THREE.SphereGeometry(1,40,32),m);o.position.set(...pos);o.scale.set(...scale);parent.add(o);return o}
ball(root,yellow,[0,.2,0],[1.42,1.42,.72]);
ball(root,white,[-.48,.48,.63],[.28,.36,.12]);ball(root,white,[.43,.43,.63],[.30,.27,.12]);ball(root,ink,[-.39,.39,.735],[.105,.15,.055]);ball(root,ink,[.50,.40,.735],[.105,.14,.055]);
let brow1=ball(root,ink,[-.48,.91,.62],[.39,.09,.08]);brow1.rotation.z=.18;let brow2=ball(root,ink,[.43,.84,.62],[.32,.085,.08]);brow2.rotation.z=-.28;
const smilePts=[new THREE.Vector3(-.38,-.28,.66),new THREE.Vector3(-.18,-.39,.72),new THREE.Vector3(.08,-.37,.74),new THREE.Vector3(.35,-.25,.66)];root.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(smilePts),28,.052,10,false),ink));for(let i=0;i<3;i++)ball(root,tooth,[-.08+i*.14,-.35,.75],[.08,.09,.04]);
ball(root,blush,[-.87,-.03,.55],[.25,.13,.04]);ball(root,blush,[.83,-.05,.55],[.25,.13,.04]);
for(const [x,y,z,sc] of [[-.93,1.02,.25,.17],[.98,.82,.24,.13]]){let d=new THREE.Mesh(new THREE.SphereGeometry(1,24,18),blue);d.position.set(x,y,z);d.scale.set(sc,sc*1.35,sc*.5);root.add(d);let tip=new THREE.Mesh(new THREE.ConeGeometry(sc*.58,sc*1.1,20),blue);tip.position.set(x,y+sc*1.25,z);root.add(tip)}
const hand=new THREE.Group();hand.position.set(1.12,-.78,.38);hand.rotation.z=-.18;root.add(hand);ball(hand,yellow,[0,0,0],[.29,.35,.2]);ball(hand,yellow,[.20,.42,0],[.16,.48,.16]);ball(hand,yellow,[0,-.30,0],[.26,.14,.17]);for(let i=0;i<3;i++)ball(hand,gold,[-.16+i*.10,-.02,.16],[.045,.13,.035]);
for(const s of [-1,1]){let mark=ball(root,blush,[s*1.08,.38,.32],[.045,.22,.04]);mark.rotation.z=-s*.4}const star=new THREE.Mesh(new THREE.OctahedronGeometry(.16),mat('#fff4a3',.25));star.position.set(-1.45,-.85,.15);root.add(star);
let targetY=.15, targetX=0, zoom=1;let stream=null, facing='environment';
function animate(){root.rotation.y+=(targetY-root.rotation.y)*.08;root.rotation.x+=(targetX-root.rotation.x)*.08;root.rotation.y+=.003;root.scale.setScalar(zoom);renderer.render(scene,camera);if(!document.hidden)requestAnimationFrame(animate)}document.addEventListener('visibilitychange',()=>{if(!document.hidden)animate()});animate();
function resize(){const ratio=Math.min(devicePixelRatio||1,innerWidth<600?1.25:1.5);renderer.setPixelRatio(ratio);renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.fov=innerWidth<600?50:38;camera.updateProjectionMatrix()}resize();addEventListener('resize',resize);
start.onclick=async()=>{try{if(!navigator.mediaDevices?.getUserMedia)throw Error('Kamera erişimi için bu sayfayı HTTPS üzerinden aç.');if(stream)stream.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing},audio:false});video.srcObject=stream;video.style.display='block';await video.play();start.style.display='none';flip.style.display='inline-block';document.querySelector('#hint').innerHTML='Cringe emojisi hazır! Sürükleyerek döndür, iki parmakla boyutunu ayarla.';}catch(e){toast.textContent=e.name==='NotAllowedError'?'Kamera izni verilmedi. Tarayıcı ayarlarından izin verip tekrar dene.':e.message;toast.style.display='block';setTimeout(()=>toast.style.display='none',4200)}};
flip.onclick=()=>{facing=facing==='environment'?'user':'environment';start.style.display='inline-block';start.textContent='Kamerayı aç';flip.style.display='none';video.style.display='none';if(stream)stream.getTracks().forEach(t=>t.stop());stream=null};
let last=null;canvas.addEventListener('pointerdown',e=>{last={x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!last)return;targetY+=(e.clientX-last.x)*.012;targetX=Math.max(-.5,Math.min(.5,targetX+(e.clientY-last.y)*.008));last={x:e.clientX,y:e.clientY}});canvas.addEventListener('pointerup',()=>last=null);
let pinch=0;canvas.addEventListener('touchmove',e=>{if(e.touches.length===2){let d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);if(pinch)zoom=Math.max(.65,Math.min(1.55,zoom+(d-pinch)*.003));pinch=d}}, {passive:true});canvas.addEventListener('touchend',()=>pinch=0);
</script></body></html>
