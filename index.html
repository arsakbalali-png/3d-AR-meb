<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<video id="cam" autoplay playsinline muted></video><canvas id="stage"></canvas><div class="shade"></div>
<div class="chooser" id="chooser"><div class="chooser-card"><span class="badge">CİHAZ SEÇİMİ</span><h1>Hangi cihazı kullanıyorsun?</h1><p>AR deneyimini telefonuna göre ayarlayalım.</p><div class="chooser-actions"><button class="btn" data-device="android">🤖 Android</button><button class="btn" data-device="iphone">🍎 iPhone</button></div></div></div>
<div class="top"><span class="badge">Kameralı mini AR</span><h1 class="title">CRINGE EMOJİSİ</h1></div>
<div class="bottom"><p class="hint" id="hint">Kamerayı aç; emojiyi yerleştirmek için ekrana dokun.<br>Emojiyi sürükleyerek taşı, iki parmakla boyutlandır.</p><div class="actions"><button class="btn" id="start">Kamerayı aç</button><button class="btn secondary" id="flip" style="display:none">Kamerayı çevir</button></div></div>
<div class="toast" id="toast"></div>
<script type="module">
import * as THREE from 'three';
import { USDZExporter } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/exporters/USDZExporter.js';
const video=document.querySelector('#cam'), canvas=document.querySelector('#stage'), start=document.querySelector('#start'), flip=document.querySelector('#flip'), toast=document.querySelector('#toast'), chooser=document.querySelector('#chooser');
const renderer=new THREE.WebGLRenderer({canvas,alpha:true,antialias:true});renderer.setClearColor(0,0);renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene(), camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.1,100);camera.position.set(0,0,8);
scene.add(new THREE.HemisphereLight(0xfff5d7,0x704c39,2));const key=new THREE.DirectionalLight(0xffffff,2.5);key.position.set(-3,5,6);scene.add(key);const pink=new THREE.PointLight(0xff6d9d,15,12);pink.position.set(2,1,3);scene.add(pink);
const root=new THREE.Group();scene.add(root);
const mat=(c,rough=.48,metal=0)=>new THREE.MeshStandardMaterial({color:c,roughness:rough,metalness:metal});
const yellow=mat('#ffc928',.32), gold=mat('#ffad16',.38), white=mat('#fffdf7'), ink=mat('#35242c'), blush=mat('#ff7185'), blue=mat('#59d8ff',.25), tooth=mat('#fff8e8');
function ball(parent,m,pos,scale){let o=new THREE.Mesh(new THREE.SphereGeometry(1,40,32),m);o.position.set(...pos);o.scale.set(...scale);parent.add(o);return o}
ball(root,yellow,[0,.2,0],[1.42,1.42,.72]);
ball(root,white,[-.48,.48,.63],[.28,.36,.12]);ball(root,white,[.43,.43,.63],[.30,.27,.12]);ball(root,ink,[-.39,.39,.735],[.105,.15,.055]);ball(root,ink,[.50,.40,.735],[.105,.14,.055]);
let brow1=ball(root,ink,[-.48,.91,.62],[.39,.09,.08]);brow1.rotation.z=.18;let brow2=ball(root,ink,[.43,.84,.62],[.32,.085,.08]);brow2.rotation.z=-.28;
const smilePts=[new THREE.Vector3(-.38,-.28,.66),new THREE.Vector3(-.18,-.39,.72),new THREE.Vector3(.08,-.37,.74),new THREE.Vector3(.35,-.25,.66)];root.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(smilePts),28,.052,10,false),ink));for(let i=0;i<3;i++)ball(root,tooth,[-.08+i*.14,-.35,.75],[.08,.09,.04]);
ball(root,blush,[-.87,-.03,.55],[.25,.13,.04]);ball(root,blush,[.83,-.05,.55],[.25,.13,.04]);
for(const [x,y,z,sc] of [[-.93,1.02,.25,.17],[.98,.82,.24,.13]]){let d=new THREE.Mesh(new THREE.SphereGeometry(1,24,18),blue);d.position.set(x,y,z);d.scale.set(sc,sc*1.35,sc*.5);root.add(d);let tip=new THREE.Mesh(new THREE.ConeGeometry(sc*.58,sc*1.1,20),blue);tip.position.set(x,y+sc*1.25,z);root.add(tip)}
const hand=new THREE.Group();hand.position.set(1.12,-.78,.38);hand.rotation.z=-.18;root.add(hand);ball(hand,yellow,[0,0,0],[.29,.35,.2]);ball(hand,yellow,[.20,.42,0],[.16,.48,.16]);ball(hand,yellow,[0,-.30,0],[.26,.14,.17]);for(let i=0;i<3;i++)ball(hand,gold,[-.16+i*.10,-.02,.16],[.045,.13,.035]);
for(const s of [-1,1]){let mark=ball(root,blush,[s*1.08,.38,.32],[.045,.22,.04]);mark.rotation.z=-s*.4}const star=new THREE.Mesh(new THREE.OctahedronGeometry(.16),mat('#fff4a3',.25));star.position.set(-1.45,-.85,.15);root.add(star);
let targetY=0, targetX=0, zoom=1;let stream=null, facing='environment', selectedDevice='', xrMode=false, xrSession=null, hitTestSource=null, currentHitPose=null;
const reticle=new THREE.Mesh(new THREE.RingGeometry(.075,.105,32),new THREE.MeshBasicMaterial({color:0xe6c8ff,side:THREE.DoubleSide}));reticle.rotation.x=-Math.PI/2;reticle.matrixAutoUpdate=false;reticle.visible=false;scene.add(reticle);
function animate(){if(!xrMode){root.rotation.y+=(targetY-root.rotation.y)*.08;root.rotation.x+=(targetX-root.rotation.x)*.08;root.scale.setScalar(zoom*(innerWidth<600?.75:1));renderer.render(scene,camera)}if(!document.hidden&&!xrMode)requestAnimationFrame(animate)}document.addEventListener('visibilitychange',()=>{if(!document.hidden)animate()});animate();
function resize(){const ratio=Math.min(devicePixelRatio||1,innerWidth<600?1.25:1.5);renderer.setPixelRatio(ratio);renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.fov=innerWidth<600?50:38;camera.updateProjectionMatrix()}resize();addEventListener('resize',resize);
async function startCameraMode(){if(!navigator.mediaDevices?.getUserMedia)throw Error('Kamera erişimi için bu sayfayı HTTPS üzerinden aç.');if(stream)stream.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing},audio:false});video.srcObject=stream;video.style.display='block';await video.play();start.style.display='none';flip.style.display='inline-block';document.querySelector('#hint').innerHTML='Boş bir yere dokun: emojiyi oraya taşı.<br>Emojiyi sürükleyebilir, iki parmakla boyutlandırabilirsin.';}
async function startIPhoneAR(){start.disabled=true;start.textContent='AR hazırlanıyor…';try{const exporter=new USDZExporter();const oldScale=root.scale.clone(),oldPosition=root.position.clone();root.scale.setScalar(.32);root.position.set(0,0,0);root.rotation.set(0,0,0);const bytes=await exporter.parseAsync(root,{quickLookCompatible:true});root.scale.copy(oldScale);root.position.copy(oldPosition);const modelUrl=URL.createObjectURL(new Blob([bytes],{type:'model/vnd.usdz+zip'}));const link=document.createElement('a');link.rel='ar';link.href=modelUrl;link.setAttribute('download','cringe-emoji.usdz');link.innerHTML='<img alt="Cringe emojisini AR’da görüntüle" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" style="width:1px;height:1px">';document.body.appendChild(link);link.click();setTimeout(()=>{URL.revokeObjectURL(modelUrl);link.remove()},60000);}catch(e){console.error(e);toast.textContent='iPhone AR modeli hazırlanamadı. Safari’de tekrar deneyebilir ya da kamera modunu kullanabilirsin.';toast.style.display='block';setTimeout(()=>toast.style.display='none',4500)}finally{start.disabled=false;start.textContent='iPhone AR’ı aç';}}
async function startAndroidAR(){if(!navigator.xr||!(await navigator.xr.isSessionSupported('immersive-ar')))throw Error('Bu tarayıcıda yüzey algılayan AR desteklenmiyor. Kamera ve sürükleme modu açılıyor.');if(stream)stream.getTracks().forEach(t=>t.stop());video.style.display='none';const session=await navigator.xr.requestSession('immersive-ar',{requiredFeatures:['hit-test'],optionalFeatures:['dom-overlay'],domOverlay:{root:document.body}});xrMode=true;xrSession=session;root.visible=false;root.scale.setScalar(.32);renderer.xr.enabled=true;await renderer.xr.setSession(session);const referenceSpace=await session.requestReferenceSpace('local');const viewerSpace=await session.requestReferenceSpace('viewer');hitTestSource=await session.requestHitTestSource({space:viewerSpace});document.querySelector('#hint').innerHTML='Yüzeyi bulmak için telefonu yavaşça hareket ettir.<br>Halka görününce dokunup emojiyi yerleştir.';start.style.display='none';flip.style.display='none';renderer.setAnimationLoop((time,frame)=>{if(frame&&hitTestSource){const hits=frame.getHitTestResults(hitTestSource);if(hits.length){const pose=hits[0].getPose(referenceSpace);if(pose){currentHitPose=pose;reticle.matrix.fromArray(pose.transform.matrix);reticle.visible=true}}else{currentHitPose=null;reticle.visible=false}}renderer.render(scene,camera)});session.addEventListener('end',()=>{renderer.setAnimationLoop(null);xrMode=false;xrSession=null;hitTestSource=null;currentHitPose=null;reticle.visible=false;root.visible=true;document.querySelector('#hint').innerHTML='AR kapandı. Yeniden başlatmak için sayfayı yenile.';});}
document.querySelectorAll('[data-device]').forEach(button=>button.addEventListener('click',()=>{selectedDevice=button.dataset.device;chooser.hidden=true;start.textContent=selectedDevice==='iphone'?'iPhone AR’ı aç':'Yüzey AR’ını aç';document.querySelector('#hint').innerHTML=selectedDevice==='iphone'?'Emojiyi gerçek dünyaya yerleştirmek için AR’ı başlat.':'Yüzey algılama destekleniyorsa emojiyi zemine/masaya yerleştir; desteklenmiyorsa kamerada taşı.';}));
start.onclick=async()=>{try{if(selectedDevice==='iphone')await startIPhoneAR();else if(selectedDevice==='android'){try{await startAndroidAR()}catch(e){toast.textContent=e.message;toast.style.display='block';setTimeout(()=>toast.style.display='none',4200);root.visible=true;await startCameraMode()}}else await startCameraMode()}catch(e){toast.textContent=e.name==='NotAllowedError'?'Kamera izni verilmedi. Tarayıcı ayarlarından izin verip tekrar dene.':e.message;toast.style.display='block';setTimeout(()=>toast.style.display='none',4200)}};
flip.onclick=()=>{facing=facing==='environment'?'user':'environment';start.style.display='inline-block';start.textContent='Kamerayı aç';flip.style.display='none';video.style.display='none';if(stream)stream.getTracks().forEach(t=>t.stop());stream=null};
const raycaster=new THREE.Raycaster(), ndc=new THREE.Vector2(), movePlane=new THREE.Plane(new THREE.Vector3(0,0,1),0);let gesture=null;const modelBounds=new THREE.Box3().setFromObject(root), modelWidth=(modelBounds.max.x-modelBounds.min.x)/(root.scale.x||1), modelHeight=(modelBounds.max.y-modelBounds.min.y)/(root.scale.y||1);function setRootPosition(x,y){const halfW=modelWidth*root.scale.x/2,halfH=modelHeight*root.scale.y/2,vHalf=camera.position.z*Math.tan(THREE.MathUtils.degToRad(camera.fov/2)),hHalf=vHalf*camera.aspect,marginX=(innerWidth<600?10:20)/innerWidth*2*hHalf,topPx=innerWidth<600?112:100,bottomPx=innerWidth<600?132:112,minX=-hHalf+halfW+marginX,maxX=hHalf-halfW-marginX,maxY=vHalf*(1-2*topPx/innerHeight)-halfH,minY=vHalf*(1-2*(innerHeight-bottomPx)/innerHeight)+halfH,cx=minX>maxX?0:THREE.MathUtils.clamp(x,minX,maxX),cy=minY>maxY?(minY+maxY)/2:THREE.MathUtils.clamp(y,minY,maxY);root.position.set(cx,cy,0)}const activePointers=new Set();function worldPoint(x,y){const rect=canvas.getBoundingClientRect();ndc.x=((x-rect.left)/rect.width)*2-1;ndc.y=-((y-rect.top)/rect.height)*2+1;raycaster.setFromCamera(ndc,camera);return raycaster.ray.intersectPlane(movePlane,new THREE.Vector3())}canvas.addEventListener('pointerdown',e=>{if(xrMode){if(currentHitPose){const m=new THREE.Matrix4().fromArray(currentHitPose.transform.matrix);root.position.setFromMatrixPosition(m);root.quaternion.setFromRotationMatrix(m);root.visible=true;reticle.visible=false}return}activePointers.add(e.pointerId);if(activePointers.size>1){gesture=null;return}canvas.setPointerCapture(e.pointerId);const p=worldPoint(e.clientX,e.clientY);const hit=raycaster.intersectObject(root,true).length>0;gesture={x:e.clientX,y:e.clientY,hit,moved:false,offsetX:root.position.x-p.x,offsetY:root.position.y-p.y}});canvas.addEventListener('pointermove',e=>{if(!gesture||activePointers.size>1)return;if(Math.hypot(e.clientX-gesture.x,e.clientY-gesture.y)>6)gesture.moved=true;if(gesture.moved){const p=worldPoint(e.clientX,e.clientY);setRootPosition(p.x+(gesture.hit?gesture.offsetX:0),p.y+(gesture.hit?gesture.offsetY:0))}});canvas.addEventListener('pointerup',e=>{const g=gesture;if(g&&!g.moved&&!g.hit){const p=worldPoint(e.clientX,e.clientY);setRootPosition(p.x,p.y)}gesture=null;activePointers.delete(e.pointerId)});canvas.addEventListener('pointercancel',e=>{gesture=null;activePointers.delete(e.pointerId)});
